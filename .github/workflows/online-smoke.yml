name: Online smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: Run bounded online integration suite
        run: pytest tests/test_online_smoke.py -v -m online -o addopts="" --timeout=20
